<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Pemesanan Tiket | Keranjang</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --matcha-dark: #5f7f52;
        --matcha-light: #a5bf93;
        --brown-dark: #5f4434;
        --brown-light: #9c7b63;
        --paper: #fcf8f3;
      }

      body {
        background: linear-gradient(
          170deg,
          rgba(165, 191, 147, 0.24) 0%,
          rgba(156, 123, 99, 0.22) 58%,
          #f8f3ee 100%
        );
      }

      .app-navbar {
        background: var(--brown-dark);
      }

      .app-navbar .navbar-brand {
        color: #f5eee6;
      }

      #loginStatus {
        background: var(--matcha-light) !important;
        color: var(--brown-dark) !important;
      }

      #btnBackToProducts {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.55);
      }

      #btnBackToProducts:hover {
        color: #fff;
        border-color: var(--matcha-light);
        background: rgba(165, 191, 147, 0.2);
      }

      #btnLogout {
        color: #fff;
        border-color: var(--matcha-dark);
        background: var(--matcha-dark);
      }

      #btnLogout:hover {
        border-color: #4f6c44;
        background: #4f6c44;
      }

      #cartCounter {
        background: var(--matcha-dark) !important;
      }

      .panel {
        border: 1px solid rgba(95, 68, 52, 0.16);
        border-radius: 1rem;
        background: var(--paper);
        box-shadow: 0 0.9rem 1.8rem rgba(95, 68, 52, 0.13);
      }

      .table thead th {
        white-space: nowrap;
      }

      .table-light th {
        background: rgba(165, 191, 147, 0.24) !important;
        color: var(--brown-dark);
      }

      .badge.text-bg-secondary {
        background: rgba(165, 191, 147, 0.36) !important;
        color: var(--brown-dark);
      }

      #btnShopNow {
        border-color: var(--matcha-dark);
        background: var(--matcha-dark);
      }

      #btnShopNow:hover {
        border-color: #4f6c44;
        background: #4f6c44;
      }

      #btnCheckout {
        border: 0;
        background: linear-gradient(110deg, var(--brown-dark), var(--matcha-dark));
      }

      #btnCheckout:hover {
        filter: brightness(1.06);
      }

      .form-control:focus {
        border-color: var(--matcha-dark);
        box-shadow: 0 0 0 0.2rem rgba(95, 127, 82, 0.2);
      }
    </style>
  </head>
  <body data-page="cart">
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm app-navbar">
      <div class="container">
        <span class="navbar-brand fw-bold">Ticket Booking Web App</span>

        <div class="d-flex align-items-center gap-2 ms-auto">
          <span id="loginStatus" class="badge text-bg-info text-dark"></span>
          <a href="./products.html" id="btnBackToProducts" class="btn btn-outline-light">
            Katalog
          </a>
          <button id="btnLogout" type="button" class="btn btn-warning fw-semibold">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <h1 class="h3 fw-bold mb-0">Keranjang Belanja</h1>
        <span class="badge text-bg-danger" id="cartCounter">0</span>
      </div>

      <div id="cartAlert" class="alert d-none" role="alert"></div>

      <section id="emptyCartState" class="card panel d-none">
        <div class="card-body text-center py-5">
          <h2 class="h5 fw-bold mb-2">Keranjang Masih Kosong</h2>
          <p class="text-secondary mb-3">Belum ada tiket yang dipilih untuk dibeli.</p>
          <a href="./products.html" class="btn btn-primary" id="btnShopNow">Pilih Tiket</a>
        </div>
      </section>

      <section id="cartTableWrapper" class="card panel">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle" id="cartTable">
              <thead class="table-light">
                <tr>
                  <th>Nama Tiket</th>
                  <th>Kategori</th>
                  <th>Harga Satuan</th>
                  <th style="width: 145px;">Jumlah Beli</th>
                  <th>Subtotal</th>
                  <th class="text-end">Aksi</th>
                </tr>
              </thead>
              <tbody id="cartTableBody"></tbody>
            </table>
          </div>

          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-3">
            <div>
              <div class="text-secondary small">Total Harga Keseluruhan</div>
              <div id="grandTotal" class="h4 fw-bold mb-0">Rp0</div>
            </div>

            <button id="btnCheckout" type="button" class="btn btn-success btn-lg">
              Lanjut ke Checkout
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
