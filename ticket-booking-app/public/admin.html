<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Pemesanan Tiket | Panel Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --matcha-dark: #5f7f52;
        --matcha-light: #a5bf93;
        --brown-dark: #5f4434;
        --paper: #fcf8f3;
      }

      body {
        background: linear-gradient(
          165deg,
          rgba(165, 191, 147, 0.24) 0%,
          rgba(156, 123, 99, 0.22) 58%,
          #f8f3ee 100%
        );
      }

      .app-navbar {
        background: var(--brown-dark);
      }

      .app-navbar .navbar-brand {
        color: #f5eee6;
      }

      #loginStatus {
        background: var(--matcha-light) !important;
        color: var(--brown-dark) !important;
      }

      #btnLogout {
        color: #fff;
        border-color: var(--matcha-dark);
        background: var(--matcha-dark);
      }

      #btnLogout:hover {
        border-color: #4f6c44;
        background: #4f6c44;
      }

      .panel {
        border: 1px solid rgba(95, 68, 52, 0.16);
        border-radius: 1rem;
        background: var(--paper);
        box-shadow: 0 0.9rem 1.8rem rgba(95, 68, 52, 0.13);
      }

      .metric-card {
        border: 1px dashed rgba(95, 68, 52, 0.22);
        border-radius: 0.8rem;
        background: rgba(165, 191, 147, 0.14);
      }

      .table-light th {
        background: rgba(165, 191, 147, 0.24) !important;
        color: var(--brown-dark);
        white-space: nowrap;
      }

      #btnApplyAdminFilter,
      #btnResetAdminFilter,
      #btnRefreshAdminData {
        border: 0;
        background: linear-gradient(110deg, var(--brown-dark), var(--matcha-dark));
      }

      #btnApplyAdminFilter:hover,
      #btnResetAdminFilter:hover,
      #btnRefreshAdminData:hover {
        filter: brightness(1.06);
      }

      .form-control:focus {
        border-color: var(--matcha-dark);
        box-shadow: 0 0 0 0.2rem rgba(95, 127, 82, 0.2);
      }
    </style>
  </head>
  <body data-page="admin">
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm app-navbar">
      <div class="container">
        <span class="navbar-brand fw-bold">Ticket Booking Web App | Admin</span>

        <div class="d-flex align-items-center gap-2 ms-auto">
          <span id="loginStatus" class="badge text-bg-info text-dark"></span>
          <button id="btnLogout" type="button" class="btn btn-warning fw-semibold">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <section class="card panel mb-3">
        <div class="card-body">
          <h1 class="h3 fw-bold mb-2">Panel Admin</h1>
          <p class="text-secondary mb-0">
            Halaman ini hanya bisa diakses oleh admin untuk memantau transaksi tiket pemesan.
          </p>
        </div>
      </section>

      <div id="adminAlert" class="alert d-none" role="alert"></div>

      <section class="card panel mb-3">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-12 col-md-6 col-xl-3">
              <div class="metric-card p-3 h-100">
                <div class="small text-secondary">Total Pesanan</div>
                <div id="adminTotalOrders" class="h4 fw-bold mb-0">0</div>
              </div>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
              <div class="metric-card p-3 h-100">
                <div class="small text-secondary">Total Pemesan</div>
                <div id="adminTotalCustomers" class="h4 fw-bold mb-0">0</div>
              </div>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
              <div class="metric-card p-3 h-100">
                <div class="small text-secondary">Total Omzet</div>
                <div id="adminTotalRevenue" class="h5 fw-bold mb-0">Rp0</div>
              </div>
            </div>
            <div class="col-12 col-md-6 col-xl-3">
              <div class="metric-card p-3 h-100">
                <div class="small text-secondary">Checkout Terbaru</div>
                <div id="adminLatestIssued" class="fw-semibold">-</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="card panel mb-3">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-lg-6">
              <label for="adminFilterUsername" class="form-label fw-semibold mb-1"
                >Filter username pemesan / order ID</label
              >
              <input
                id="adminFilterUsername"
                type="text"
                class="form-control"
                placeholder="contoh: user@mail.com atau ORD-1"
              />
            </div>
            <div class="col-12 col-lg-6 d-flex gap-2">
              <button id="btnApplyAdminFilter" type="button" class="btn btn-primary">
                Terapkan Filter
              </button>
              <button id="btnResetAdminFilter" type="button" class="btn btn-primary">
                Reset
              </button>
              <button id="btnRefreshAdminData" type="button" class="btn btn-primary ms-auto">
                Refresh Data
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="card panel">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Order ID</th>
                  <th>Username</th>
                  <th>Nama Pemesan</th>
                  <th>Status</th>
                  <th>Waktu</th>
                  <th>Item</th>
                  <th>Total</th>
                  <th>Detail Konser</th>
                </tr>
              </thead>
              <tbody id="adminOrdersBody">
                <tr>
                  <td colspan="8" class="text-center text-secondary py-4">
                    Memuat data...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
