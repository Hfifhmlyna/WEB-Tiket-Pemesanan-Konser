<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Pemesanan Tiket | Checkout</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --matcha-dark: #5f7f52;
        --matcha-light: #a5bf93;
        --brown-dark: #5f4434;
        --brown-light: #9c7b63;
        --paper: #fcf8f3;
      }

      body {
        background: linear-gradient(
          165deg,
          rgba(165, 191, 147, 0.24) 0%,
          rgba(156, 123, 99, 0.22) 58%,
          #f8f3ee 100%
        );
      }

      .app-navbar {
        background: var(--brown-dark);
      }

      .app-navbar .navbar-brand {
        color: #f5eee6;
      }

      #loginStatus {
        background: var(--matcha-light) !important;
        color: var(--brown-dark) !important;
      }

      #btnBackToCart {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.55);
      }

      #btnBackToCart:hover {
        color: #fff;
        border-color: var(--matcha-light);
        background: rgba(165, 191, 147, 0.2);
      }

      #btnLogout {
        color: #fff;
        border-color: var(--matcha-dark);
        background: var(--matcha-dark);
      }

      #btnLogout:hover {
        border-color: #4f6c44;
        background: #4f6c44;
      }

      .panel {
        border: 1px solid rgba(95, 68, 52, 0.16);
        border-radius: 1rem;
        background: var(--paper);
        box-shadow: 0 0.9rem 1.8rem rgba(95, 68, 52, 0.13);
      }

      .table-light th {
        background: rgba(165, 191, 147, 0.24) !important;
        color: var(--brown-dark);
      }

      #btnSubmitOrder,
      #btnBackAfterOrder,
      #btnViewTicket {
        border: 0;
        background: linear-gradient(110deg, var(--brown-dark), var(--matcha-dark));
      }

      #btnSubmitOrder:hover,
      #btnBackAfterOrder:hover,
      #btnViewTicket:hover {
        filter: brightness(1.06);
      }

      .modal-header {
        background: var(--brown-dark) !important;
      }

      .form-control:focus {
        border-color: var(--matcha-dark);
        box-shadow: 0 0 0 0.2rem rgba(95, 127, 82, 0.2);
      }
    </style>
  </head>
  <body data-page="checkout">
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm app-navbar">
      <div class="container">
        <span class="navbar-brand fw-bold">Ticket Booking Web App</span>

        <div class="d-flex align-items-center gap-2 ms-auto">
          <span id="loginStatus" class="badge text-bg-info text-dark"></span>
          <a href="./cart.html" id="btnBackToCart" class="btn btn-outline-light">Keranjang</a>
          <button id="btnLogout" type="button" class="btn btn-warning fw-semibold">Logout</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="h3 fw-bold mb-3">Checkout & Pesanan</h1>

      <div class="row g-3">
        <div class="col-12 col-lg-6">
          <section class="card panel h-100">
            <div class="card-body">
              <h2 class="h5 fw-bold mb-3">Ringkasan Tiket</h2>

              <div class="table-responsive">
                <table class="table align-middle" id="checkoutSummaryTable">
                  <thead class="table-light">
                    <tr>
                      <th>Nama Tiket</th>
                      <th>Qty</th>
                      <th>Subtotal</th>
                    </tr>
                  </thead>
                  <tbody id="checkoutSummaryBody"></tbody>
                </table>
              </div>

              <div class="d-flex justify-content-between align-items-center mt-2">
                <span class="text-secondary">Total Harga</span>
                <strong id="checkoutGrandTotal" class="h5 mb-0">Rp0</strong>
              </div>
            </div>
          </section>
        </div>

        <div class="col-12 col-lg-6">
          <section class="card panel h-100">
            <div class="card-body">
              <h2 class="h5 fw-bold mb-3">Data Penerima / Pemesan</h2>

              <div id="checkoutAlert" class="alert d-none" role="alert"></div>

              <form id="checkoutForm" novalidate>
                <div class="mb-3">
                  <label for="recipientName" class="form-label fw-semibold">Nama Lengkap</label>
                  <input id="recipientName" type="text" class="form-control" />
                </div>

                <div class="mb-3">
                  <label for="address" class="form-label fw-semibold"
                    >Alamat Pengiriman / Email Tiket</label
                  >
                  <textarea id="address" class="form-control" rows="2"></textarea>
                </div>

                <div class="mb-3">
                  <label for="phone" class="form-label fw-semibold">Nomor Telepon</label>
                  <input id="phone" type="tel" class="form-control" />
                </div>

                <button id="btnSubmitOrder" type="submit" class="btn btn-primary w-100">
                  Konfirmasi Pesanan
                </button>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-success text-white">
            <h3 class="modal-title h5 mb-0">Checkout Berhasil</h3>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="mb-2">
              <strong>ID Pesanan:</strong> <span id="orderIdValue">-</span>
            </p>
            <p class="mb-0">
              <strong>Status Pesanan:</strong> <span id="orderStatusValue">-</span>
            </p>
          </div>
          <div class="modal-footer">
            <a href="./ticket.html" id="btnViewTicket" class="btn btn-primary">Lihat Tiket</a>
            <a href="./products.html" id="btnBackAfterOrder" class="btn btn-primary">Kembali ke Katalog</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
