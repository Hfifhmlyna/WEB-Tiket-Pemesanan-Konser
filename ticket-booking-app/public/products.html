<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Pemesanan Tiket | Katalog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --matcha-dark: #5f7f52;
        --matcha-light: #a5bf93;
        --brown-dark: #5f4434;
        --brown-light: #9c7b63;
        --paper: #fcf8f3;
      }

      body {
        background: linear-gradient(
          165deg,
          rgba(165, 191, 147, 0.26) 0%,
          rgba(156, 123, 99, 0.22) 60%,
          #f8f3ee 100%
        );
      }

      .app-navbar {
        background: var(--brown-dark);
      }

      .app-navbar .navbar-brand {
        color: #f5eee6;
      }

      #loginStatus {
        background: var(--matcha-light) !important;
        color: var(--brown-dark) !important;
      }

      #btnGoToCart {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.55);
      }

      #btnGoToCart:hover {
        color: #fff;
        border-color: var(--matcha-light);
        background: rgba(165, 191, 147, 0.2);
      }

      #cartCounter {
        background: var(--matcha-dark) !important;
      }

      #btnLogout {
        color: #fff;
        border-color: var(--matcha-dark);
        background: var(--matcha-dark);
      }

      #btnLogout:hover {
        border-color: #4f6c44;
        background: #4f6c44;
      }

      .hero-banner {
        border: 1px solid rgba(95, 68, 52, 0.16);
        border-radius: 1rem;
        background: linear-gradient(
          125deg,
          rgba(165, 191, 147, 0.35),
          rgba(156, 123, 99, 0.25)
        );
        box-shadow: 0 0.9rem 1.8rem rgba(95, 68, 52, 0.14);
      }

      .ticket-card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(95, 68, 52, 0.14);
        border-radius: 1rem;
        background: var(--paper);
        box-shadow: 0 0.7rem 1.4rem rgba(95, 68, 52, 0.12);
      }

      .artist-photo-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0.28;
        transform: scale(1.02);
      }

      .ticket-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          175deg,
          rgba(252, 248, 243, 0.9) 0%,
          rgba(252, 248, 243, 0.96) 42%,
          rgba(252, 248, 243, 0.98) 100%
        );
      }

      .ticket-card .card-body {
        position: relative;
        z-index: 1;
      }

      .ticket-price {
        color: var(--brown-dark);
      }

      .btn-gradient {
        border: 0;
        background: linear-gradient(110deg, var(--brown-dark), var(--matcha-dark));
      }

      .btn-gradient:hover {
        filter: brightness(1.06);
      }

      .ticket-card .text-bg-primary {
        background: var(--matcha-dark) !important;
      }

      .ticket-card .text-bg-warning {
        background: rgba(156, 123, 99, 0.22) !important;
        color: var(--brown-dark) !important;
      }

      .form-control:focus {
        border-color: var(--matcha-dark);
        box-shadow: 0 0 0 0.2rem rgba(95, 127, 82, 0.2);
      }
    </style>
  </head>
  <body data-page="products">
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm app-navbar">
      <div class="container">
        <span class="navbar-brand fw-bold">Ticket Booking Web App</span>

        <div class="d-flex align-items-center gap-2 ms-auto">
          <span id="loginStatus" class="badge text-bg-info text-dark"></span>

          <a id="btnGoToCart" href="./cart.html" class="btn btn-outline-light position-relative">
            Keranjang
            <span id="cartCounter" class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger"
              >0</span
            >
          </a>

          <button id="btnLogout" type="button" class="btn btn-warning fw-semibold">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <section class="card hero-banner mb-4">
        <div class="card-body">
          <h1 class="h3 fw-bold mb-2">Katalog Tiket Konser</h1>
          <p class="mb-0 text-secondary">
            Contoh konser yang tersedia: NCT, NCT DREAMS, EXO, LYKN, ATLAS, dan
            JASPER di berbagai kota Indonesia.
          </p>
        </div>
      </section>

      <div id="productAlert" class="alert d-none" role="alert"></div>

      <section id="productGrid" class="row g-3"></section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
